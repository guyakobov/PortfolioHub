    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Workaround for Chrome 130+ where window.fetch is a getter and polyfills try to overwrite it
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() { return originalFetch; },
          set() { console.log("Prevented overwrite of window.fetch"); }
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
